<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebBus | Iniciar sesion administrador</title>
        <link rel="stylesheet" href="../inicioSesion/inicioSesion.css">
    </head>

    <body>
        <div class="login-panel">
            <h2>Administrador</h2>
            <form id="loginForm">
                <label>Correo electronico</label>
                <input type="email" placeholder="Ingresa tu email" required>
                <label>Contraseña</label>
                <input type="password" placeholder="Ingresa tu contraseña" required>
                <button type="submit">Iniciar sesion</button>
                <p class="registrarse"><a href="../inicioSesion/inicioSesion.html">Volver al inicio de sesión</a></p>
            </form>
        </div>

        <footer>
            © 2026 Web Bus - Nicole Castilla, Marlon Pertuz y Joshua Castro.
        </footer>
    </body>
</html>
